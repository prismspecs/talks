<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to Sender — slideshow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 16px;
  }
  #stage img, #stage video {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    background: #000;
    outline: none;
  }
  #stage video { max-height: 100%; }
  #stage iframe {
    aspect-ratio: 16 / 9;
    width: min(100%, calc(88vh * 1.7778));
    border: 0;
    background: #000;
  }
  #cover {
    text-align: center;
    padding: 24px;
  }
  #cover h1 { font-size: clamp(2rem, 6vw, 4rem); font-weight: 600; letter-spacing: 0.01em; }
  #cover p { margin-top: 18px; font-size: clamp(1rem, 2vw, 1.3rem); opacity: 0.7; max-width: 60ch; line-height: 1.5; }
  #audio-box { text-align: center; }
  #audio-box img { max-height: 60vh; max-width: 100%; object-fit: contain; display: block; margin: 0 auto; }
  #audio-player {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #audio-player button {
    background: #fff; color: #000; border: 0; cursor: pointer;
    font-size: 1.1rem; padding: 8px 18px; border-radius: 4px;
  }
  #audio-player input[type=range] { width: min(420px, 60vw); accent-color: #fff; }
  #audio-player span { font-size: 0.8rem; opacity: 0.6; min-width: 90px; text-align: center; font-variant-numeric: tabular-nums; }
  #caption {
    text-align: center;
    font-size: 1rem;
    padding: 14px 24px;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
    outline: none;
    border: 1px dashed transparent;
    color: #fff;
    background: transparent;
    min-height: 1.4em;
    line-height: 1.4;
  }
  #caption:focus { border-color: #555; }
  #controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 14px 16px 20px;
  }
  #controls button {
    background: #fff; color: #000; border: 0; cursor: pointer;
    font-size: 1rem; padding: 10px 20px; border-radius: 4px; min-width: 110px;
  }
  #controls button:hover { background: #ddd; }
  #counter { font-size: 0.85rem; opacity: 0.55; font-variant-numeric: tabular-nums; min-width: 70px; text-align: center; }
  #hint { font-size: 0.7rem; opacity: 0.3; }
  @media (max-width: 640px) {
    #controls button { min-width: 0; flex: 1; }
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="caption" contenteditable="true" spellcheck="false"></div>
  <div id="controls">
    <button id="prev">← Back</button>
    <span id="counter">1 / 1</span>
    <button id="next">Forward →</button>
  </div>
  <div id="hint" style="position:fixed;right:10px;bottom:6px;">←/→ navigate · space play/pause · double-click caption to edit</div>

<script src="slides.js"></script>
<script>
  let slides = [];
  let idx = 0;
  const stage = document.getElementById('stage');
  const captionEl = document.getElementById('caption');
  const counterEl = document.getElementById('counter');

  function fmt(t) {
    if (!isFinite(t)) return '0:00';
    t = Math.round(t);
    const m = Math.floor(t / 60), s = t % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function currentMedia() {
    return stage.querySelector('video, audio, #audio-player audio');
  }

  async function render() {
    stage.innerHTML = '';
    const s = slides[idx];
    if (s.kind === 'cover') {
      const d = document.createElement('div');
      d.id = 'cover';
      d.innerHTML = '<h1></h1><p></p>';
      d.querySelector('h1').textContent = s.title;
      d.querySelector('p').textContent = s.subtitle;
      stage.appendChild(d);
    } else if (s.kind === 'image') {
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.caption || '';
      stage.appendChild(img);
    } else if (s.kind === 'video') {
      const v = document.createElement('video');
      v.src = s.src;
      v.controls = true;
      v.preload = 'metadata';
      stage.appendChild(v);
    } else if (s.kind === 'youtube') {
      const f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + s.id + '?rel=0';
      f.allow = 'fullscreen; picture-in-picture; encrypted-media';
      f.allowFullscreen = true;
      stage.appendChild(f);
    } else if (s.kind === 'audio') {
      const box = document.createElement('div');
      box.id = 'audio-box';
      if (s.image) {
        const img = document.createElement('img');
        img.src = s.image;
        box.appendChild(img);
      }
      const player = document.createElement('div');
      player.id = 'audio-player';
      const btn = document.createElement('button');
      btn.textContent = '▶';
      const slider = document.createElement('input');
      slider.type = 'range'; slider.min = 0; slider.max = 100; slider.value = 0;
      const time = document.createElement('span');
      time.textContent = '0:00 / 0:00';
      const a = document.createElement('audio');
      a.src = s.src; a.preload = 'metadata';
      slider.addEventListener('input', () => { if (a.duration) a.currentTime = slider.value / 100 * a.duration; });
      a.addEventListener('timeupdate', () => {
        if (a.duration) slider.value = a.currentTime / a.duration * 100;
        time.textContent = fmt(a.currentTime) + ' / ' + fmt(a.duration);
      });
      a.addEventListener('loadedmetadata', () => time.textContent = '0:00 / ' + fmt(a.duration));
      btn.addEventListener('click', () => {
        if (a.paused) { a.play(); btn.textContent = '❚❚'; }
        else { a.pause(); btn.textContent = '▶'; }
      });
      a.addEventListener('ended', () => { btn.textContent = '▶'; });
      player.appendChild(btn); player.appendChild(slider); player.appendChild(time);
      box.appendChild(player);
      box.appendChild(a);
      stage.appendChild(box);
    }
    const saved = JSON.parse(localStorage.getItem('rts-captions') || '{}');
    captionEl.textContent = saved[idx] !== undefined ? saved[idx] : (s.caption || '');
    counterEl.textContent = (idx + 1) + ' / ' + slides.length;
  }

  function go(n) {
    if (n < 0 || n >= slides.length) return;
    idx = n;
    render();
  }

  captionEl.addEventListener('blur', () => {
    const saved = JSON.parse(localStorage.getItem('rts-captions') || '{}');
    saved[idx] = captionEl.textContent;
    localStorage.setItem('rts-captions', JSON.stringify(saved));
  });

  document.getElementById('prev').addEventListener('click', () => go(idx - 1));
  document.getElementById('next').addEventListener('click', () => go(idx + 1));

  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') go(idx - 1);
    else if (e.key === 'ArrowRight') go(idx + 1);
    else if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      const m = currentMedia();
      if (m) { if (m.paused) m.play(); else m.pause(); }
    }
  });

  slides = SLIDES.slides;
  render();
</script>
</body>
</html>
