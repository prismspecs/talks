<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker Notes | Digital Sabotage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #fff;
    color: #000;
    font-family: Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 22px 12px;
    border-bottom: 1px solid #ddd;
    flex-shrink: 0;
  }
  header .tag {
    font-size: 0.62rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #666;
  }
  header h1 {
    margin-top: 6px;
    font-size: 1.05rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  header .sub {
    margin-top: 4px;
    font-size: 0.72rem;
    color: #666;
  }
  header .status {
    margin-top: 8px;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: #999;
  }
  #content {
    flex: 1;
    overflow-y: auto;
    padding: 18px 24px 40px;
    scroll-behavior: smooth;
  }
  #content::-webkit-scrollbar { width: 8px; }
  #content::-webkit-scrollbar-thumb { background: #ddd; }
  .doc-title {
    font-size: 1rem;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
  }
  section { margin-top: 28px; }
  section h2 {
    font-size: 0.82rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-bottom: 6px;
    margin-bottom: 10px;
    border-bottom: 1px solid #ddd;
  }
  section.current h2 { background: #000; color: #fff; display: inline-block; padding: 0 4px; }
  p { font-size: 0.95rem; line-height: 1.65; margin-bottom: 10px; }
  strong { font-weight: 600; }
  a { color: #000; }
  ul { margin: 0 0 10px 1.2em; }
  li { font-size: 0.95rem; line-height: 1.6; margin-bottom: 4px; }
  blockquote {
    margin: 12px 0;
    padding: 10px 16px;
    border-left: 2px solid #000;
    background: #f5f5f5;
  }
  blockquote p { margin-bottom: 0; font-style: italic; }
  .loading, .error {
    font-size: 0.8rem;
    color: #000;
  }
  .error { line-height: 1.6; max-width: 40rem; }
</style>
</head>
<body>
  <header>
    <span class="tag">speaker notes</span>
    <h1>Digital Sabotage</h1>
    <p class="sub">from the Pioneer Works talk, syncs to the current slide</p>
    <div class="status" id="status">waiting for the presentation…</div>
  </header>
  <main id="content"><p class="loading">loading notes…</p></main>
<script src="slides-data.js"></script>
<script src="notes.js"></script>
</body>
</html>
